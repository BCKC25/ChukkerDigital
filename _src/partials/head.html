<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<script>document.documentElement.className += " js";</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#1e3a2b">
<meta name="author" content="Chukker Digital">
<meta name="geo.region" content="US-SC">
<meta name="geo.placename" content="Aiken">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Chukker Digital">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{site_url}}/assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Chukker Digital crest with the line: Your website, search and ads, handled by one person in Aiken, SC.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{og_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{site_url}}/assets/img/og-image.png">

<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css?v={{version}}">
{{tracking}}
{{jsonld}}
</head>
